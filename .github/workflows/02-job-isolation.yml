name: Job Isolation

on:
  workflow_dispatch:

jobs:
  create-file:
    runs-on: ubuntu-latest

    steps:
      - name: Create file
        run: |
          echo "Hello GitHub Actions" > result.txt

      - name: Read file
        run: |
          cat result.txt

  read-file:
    runs-on: ubuntu-latest
    needs: create-file

    steps:
      - name: Read file
        run: |
          cat result.txt