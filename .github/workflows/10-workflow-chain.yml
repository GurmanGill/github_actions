name: Workflow Chain

on:
    workflow_run:
        workflows:
            - "Manual Execution"
        types:
            - completed

jobs:
    debug:
        runs-on: ubuntu-latest

        steps:
        - name: Check previous workflow
          run: |
            echo "Workflow: ${{ github.event.workflow_run.name }}"
            echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "Status: ${{ github.event.workflow_run.status }}"
            echo "Event: ${{ github.event.workflow_run.event }}"

    process: 
        runs-on: ubuntu-latest

        if: ${{ github.event.workflow_run.conclusion == 'succcess' }}

        steps:
            - name: Process successfull execution
              run: echo "Preivious workflow completed successfully"