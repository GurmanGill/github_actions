name: Variables and Contexts

on:
    workflow_dispatch:

env:
    APP_NAME: github-actions
    LOG_LEVEL: info

jobs:
    inspect:
        runs-on: ubuntu-latest

        steps:
            - name: Workflow and job variables
              run: |
                echo "Application: $APP_NAME"
                echo "Log level: $LOG_LEVEL"
            
            - name: Step-level variable
              env: 
                LOG_LEVEL: ERROR
              run: |
                echo "Log level: $LOG_LEVEL"

            - name: Check variable again
              run: |
                echo "Log level: $LOG_LEVEL"

            - name: Read repository variables
              env:
                APP_VERSION: ${{ vars.APP_VERSION }}
                TARGET_ENV: ${{ vars.TARGET_ENV }}
                BATCH_SIZE: ${{ vars.BATCH_SIZE }}
              run: |
                echo "Version: $APP_VERSION"
                echo "Environment: $TARGET_ENV"
                echo "Batch size: $BATCH_SIZE"

            - name: Validate secret availability
              env:
                API_KEY: ${{ secrets.API_KEY }}
              run: |
                if [ -n "$API_KEY" ]; then
                    echo "API key is available"
                else
                    echo "API key is missing"
                    exit 1
                fi

            - name: Inspect Github context
              run: |
                echo "Repository: ${{ github.repository }}"
                echo "Actor: ${{ github.actor }}"
                echo "Branch: ${{ github.ref_name }}"
                echo "Commit: ${{ github.sha }}"
                echo "Event: ${{ github.event_name }}"
                echo "Run ID: ${{ github.run_id }}"
                echo "Run number: ${{ github. run_number }}"
                echo "Run attempt: ${{ github.run_attempt }}"

            - name: Inspect runner context
              run: |
                echo "Runner: ${{ runner.name }}"
                echo "OS: ${{ runner.os }}"
                echo "Architecture: ${{ runner.arch }}"
                echo "Temp directory: ${{ runner.temp }}"

            - name: Generate runtime variables
              run: |
                echo "PROCESS_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
                echo "BUILD_VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

            - name: Read runtime variables
              run: |
                echo "Process date: $PROCESS_DATE"
                echo "Build version: $BUILD_VERSION"