name: Steps Outputs

on:
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - name: Generate configuration
              id: config
              run: |
                echo "version=1.0.0" >> $GITHUB_OUTPUT
                echo "environment=dev" >> $GITHUB_OUTPUT
                echo "deploy=true" >> $GITHUB_OUTPUT

            - name: Read configuration
              run: |
                echo "Version: ${{ steps.config.outputs.version }}"
                echo "Environment: ${{ steps.config.outputs.environment }}"
                echo "Deploy: ${{ steps.config.outputs.deploy }}"

            - name: Deploy application
              if: ${{ steps.config.outputs.deploy == 'true' }}
              run: echo "Deploying application"

            - name: Generate execution summary
              run: |
                echo "## Execution Summary" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
                echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
                echo "| Version | 1.0.0 |" >> "$GITHUB_STEP_SUMMARY"
                echo "| Environment | dev |" >> "$GITHUB_STEP_SUMMARY"
                echo "| Status | Success |" >> "$GITHUB_STEP_SUMMARY"
