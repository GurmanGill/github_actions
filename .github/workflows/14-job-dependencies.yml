name: Job Dependencies

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        run: echo "Preparing application"

  tests:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Run tests
        run: |
          sleep 10
          echo "Tests completed"

  lint:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Run linting
        run: |
          sleep 5
          echo "Linting completed"

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, lint]

    steps:
      - name: Deploy
        run: echo "Deploying application"