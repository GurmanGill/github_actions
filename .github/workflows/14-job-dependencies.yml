name: Job Dependencies

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        run: echo "Preparing application"

  tests:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Run tests
        run: exit 1

  lint:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Run linting
        run: |
          sleep 5
          echo "Linting completed"

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, lint]

    steps:
      - name: Deploy
        run: echo "Deploying application"

  report:
    runs-on: ubuntu-latest
    needs: [setup, tests, lint, deploy]

    if: ${{ always() }}

    steps:
      - name: Report execution results
        run: |
          echo "Setup: ${{ needs.setup.result }}"
          echo "Tests: ${{ needs.tests.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"