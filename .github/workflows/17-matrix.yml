name: Matrix Strategy

on: 
    workflow_dispatch:

jobs:
    python-validation:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version:
                    - '3.10'
                    - '3.11'
                    - '3.12'

        steps:
            - name: Setup Python
              uses: actions/Setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

            - name: Validate Python
              run: |
                python --version
                echo "Validation successfull"