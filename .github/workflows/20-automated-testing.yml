name: Automated Testing

on: 
    workflow_dispatch:
    
    pull_request:
        branches:
            - main

permissions:
    contents: read

defaults:
    run:
        shell: bash
        working-directory: example/automated_testing

jobs:
    code-quality:
      name: Code Quality
      runs-on: ubuntu-latest
      timeout-minutes: 5

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Ruff
          run: pip install ruff

        - name: Liniting check
          run: ruff check src/ tests/ --output-format=github

        - name: Formatting check
          run: ruff format --check src/ tests/

    unit-tests:
        name: Python Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install -r requirements.txt

            - name: Execute Python tests
              run: |
                python -m pytest \
                    tests/test_calculator.py \
                    tests/test_weather_api.py -v

    spark-tests:
        name: Spark Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'

            - name: Install dependencies
              run: python -m pip install -r requirements.txt

            - name: Execute Spark tests
              env:
                SPARK_LOCAL_IP: '127.0.0.1'
              run: |
                python -m pytest tests/test_transformations.py -v