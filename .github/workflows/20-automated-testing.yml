name: Automated Testing

on: 
    workflow_dispatch:
    
    pull_request:
        branches:
            - main

permissions:
    contents: read

defaults:
    run:
        shell: bash
        working-directory: example/automated_testing

jobs:
    code-quality:
      name: Code Quality
      runs-on: ubuntu-latest
      timeout-minutes: 5

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Ruff
          run: pip install ruff

        - name: Liniting check
          run: ruff check src/ tests/ --output-format=github

        - name: Formatting check
          run: ruff format --check src/ tests/

    unit-tests:
        name: Python Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install -r requirements.txt

            - name: Execute Python tests with coverage
              run: |
                python -m pytest \
                    tests/test_calculator.py \
                    tests/test_weather_api.py -v \
                    -cov=src.calculator \
                    -cov=src.weather_api \
                    -cov=src=term-missing \
                    -cov-report=xml:coverage-python.xml \
                    -cov-fail-under=80

    spark-tests:
        name: Spark Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'

            - name: Install dependencies
              run: python -m pip install -r requirements.txt

            - name: Execute Spark tests
              env:
                SPARK_LOCAL_IP: '127.0.0.1'
              run: |
                python -m pytest tests/test_transformations.py -v

    quality-gate:
      name: Quality Gate
      runs-on: ubuntu-latest

      needs:
        - code-quality
        - unit-tests
        - spark-tests

      if: ${{ !cancelled() }}

      defaults:
        run:
          working-directory: .

      steps:
        - name: Generate summary
          run: |
            echo "## Quality Gate Results" >> "$GITHUB_STEP_SUMMARY"

            echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

            echo "| Code Quality | ${{ needs.code-quality.result }} |" >> "$GITHUB_STEP_SUMMARY"

            echo "| Python Tests | ${{ needs.unit-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"

            echo "| Spark Tests | ${{ needs.spark-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"

        - name: Enforce quality gate
          if: >-
            ${{
              needs.code-quality.result != 'success' ||
              needs.unit-tests.result != 'success' ||
              needs.spark-tests.result != 'success' }}
          run: exit 1