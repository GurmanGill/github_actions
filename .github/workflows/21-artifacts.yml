name: Artifact Storage

on:
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - name: Generate Report
              run: |
                mkdir -p reports
                echo "Validation successfull" >> reports/results.txt

            - name: Upload report
              id: upload
              uses: actions/upload-artifact@v4
              with:
                name: validation-report
                path: reports/
                retention-days: 7
                if-no-files-found: error

            - name: Inspect artifact metadata
              run: |
                echo "Artifact ID: ${{ steps.upload.outputs.artifact-id}}"
                echo "Artifact URL: ${{ steps.upload.outputs.artifact-url}}"

    consume:
        runs-on: ubuntu-latest
        needs: generate

        steps:
            - name: Download report
              id: download
              uses: actions/download-artifact@v4
              with:
                name: validation-report
                path: downloaded-reports/

            - name: Inspect downloaded report
              run: |
                echo "Download path: ${{ steps.download.outputs.download-path }}"
                ls -la downloaded-reports/
                cat downloaded-reports/results.txt