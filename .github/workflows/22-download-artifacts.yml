name: Download Previous Artifacts

on:
    workflow_dispatch:
        inputs:
            run_id:
                description: Source workflow run ID
                required: true
                type: string

permissions:
    actions: read
    contents: read

jobs:
    download:
        runs-on: ubuntu-latest

        steps:
            - name: Download previous coverage report
              uses: actions/download-artifact@v4
              with:
                name: coverage-python
                path: reports/
                run-id: ${{ inputs.run_id }}
                github-token: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Inspect report
              run: |
                ls -la reports/
                cat reports/coverage-python.xml