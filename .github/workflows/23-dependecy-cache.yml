name: Dependency Caching

on:
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash
        working-directory: example/automated_testing

jobs:
    test-cache:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Restore pip cache
              id: pip-cache
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-python311-pip-${{ hashFiles('example/automated_testing/requirements.txt' )}}
                restore-keys: |
                  ${{ runner.os }}-python311-pip-

            - name: Inspect cache
              run: |
                echo "Cache hit: ${{ steps.pip-cache.outputs.cache-hit }}"

                python -m pip cache info

            - name: Install dependencies
              run: |
                time python -m pip install -r requirements.txt